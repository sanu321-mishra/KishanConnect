<div class="knowledge-base-detail">
  <div *ngIf="isLoading">{{'Loading article...'| translate}}</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="article">
    <h2>
      <button class="back-btn" (click)="backToKnowledgeBase()">{{'← Back to Knowledge Base'| translate}}</button>
      {{ article.title | translate}}
    </h2>
    <div class="article-meta">
      <span *ngIf="article.category">{{'Category:'| translate}} {{ article.category | translate}}</span>
      <span>{{'Created:'| translate}} {{ article.created_at | date:'medium' | translate}}</span>
    </div>
    <div class="article-content" [innerHTML]="article.content | translate"></div>
    <div *ngIf="isAdmin" class="admin-actions">
      <button (click)="editArticle()">{{'Edit'| translate}}</button>
      <button (click)="deleteArticle()">{{'Delete'| translate}}</button>
    </div>
  </div>
</div>
