<div class="knowledge-base-edit">
  <h2>{{ isEditMode ? 'Edit Article' : 'Add Article' | translate}}</h2>
  <form [formGroup]="articleForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="title">{{'Title'| translate}}</label>
      <input id="title" formControlName="title" required />
    </div>
    <div>
      <label for="category">{{'Category'| translate}}</label>
      <input id="category" formControlName="category" />
    </div>
    <div>
      <label for="content">{{'Content'| translate}}</label>
      <textarea id="content" formControlName="content" rows="8" required></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" [disabled]="articleForm.invalid || isLoading">{{'Save'| translate}}</button>
      <button type="button" (click)="cancel()">{{'Cancel'| translate}}</button>
    </div>
    <div *ngIf="isLoading">{{'Saving...'| translate}}</div>
    <div *ngIf="error" class="error">{{ error | translate}}</div>
  </form>
</div>
